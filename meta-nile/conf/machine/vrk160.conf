#@TYPE: Machine
#@NAME: vrk160
#@DESCRIPTION: Machine configuration for the VRK160 RF board.

#### Preamble
MACHINEOVERRIDES =. "${@['', 'vrk160:']['vrk160' !='${MACHINE}']}"
#### Regular settings follow
BBMULTICONFIG += "vrk160-microblaze-pmc vrk160-microblaze-psm"

TUNEFILE[microblaze-pmc] = "conf/machine/include/vrk160/microblaze.inc"
TUNEFILE[microblaze-psm] = "conf/machine/include/vrk160/microblaze.inc"

# Platform Loader and Manager: PLM and PSM are built from the multiconfigs in conf/multiconfig
PLM_DEPENDS = ""
PLM_MCDEPENDS = "mc::vrk160-microblaze-pmc:plm-firmware:do_deploy"
PLM_DEPLOY_DIR = "${TMPDIR}-vrk160-microblaze-pmc/deploy/images/${MACHINE}"

# PSM Firmware
PSM_DEPENDS = ""
PSM_MCDEPENDS = "mc::vrk160-microblaze-psm:psm-firmware:do_deploy"
PSM_FIRMWARE_DEPLOY_DIR = "${TMPDIR}-vrk160-microblaze-psm/deploy/images/${MACHINE}"

# Linux device tree: cortexa72-linux.dts is the flattened output of gen-machine-conf parse-sdt
# (from Max's VRK160 export). It lives in conf/dts/vrk160 and must be read at parse time.
CONFIG_DTFILE_DIR := "${@bb.utils.which(d.getVar('BBPATH'), 'conf/dts/${MACHINE}')}"
CONFIG_DTFILE ?= "${CONFIG_DTFILE_DIR}/cortexa72-linux.dts"
CONFIG_DTFILE[vardepsexclude] += "CONFIG_DTFILE_DIR"

# Yocto arm-trusted-firmware(TF-A) variables
TFA_CONSOLE ?= "pl011"
TFA_BL33_LOAD ?= "0x8000000"

# Set DDR Base address for u-boot-xlnx-scr variables
DDR_BASEADDR ?= "0x0"
SKIP_APPEND_BASEADDR ?= "0"

# Yocto KERNEL Variables
UBOOT_ENTRYPOINT  ?= "0x200000"
UBOOT_LOADADDRESS ?= "0x200000"

# Required generic machine inclusion
require conf/machine/versal-generic.conf

# This is an 'SDT' based BSP
XILINX_WITH_ESW = "sdt"

# SDT artifacts: pinned commit of the versalrf-vivado handoff repo (vrk160-base/generated/sdt), Max's export
SDT_URI = "git://dev.azure.com/ni/Users/_git/versalrf-vivado;protocol=https;branch=main;rev=8d90b79572754f82f9366de2da3a32b6f899a5ef"
SDT_URI[S] = "${WORKDIR}/git/vrk160-base/generated/sdt"

# Set the system device trees
SYSTEM_DTFILE_DEPENDS = "sdt-artifacts"
SYSTEM_DTFILE_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
SYSTEM_DTFILE = "${SYSTEM_DTFILE_DIR}/system-top.dts"

# Per-multiconfig features and libxil settings, generated by gen-machine-conf parse-sdt
include conf/machine/include/vrk160/${BB_CURRENT_MC}-features.conf
LIBXIL_CONFIG = "conf/machine/include/vrk160/${BB_CURRENT_MC}-libxil.conf"

# Versal PDI (boot PDI from the base design; the PL-only PDI is loaded separately)
PDI_PATH_DEPENDS = "sdt-artifacts"
PDI_PATH_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
PDI_PATH = "${PDI_PATH_DIR}/x5xx_top_boot.pdi"

# Update bootbin to use proper device tree
BIF_PARTITION_IMAGE[device-tree] = "${RECIPE_SYSROOT}/boot/devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"

# Remap boot files to ensure the right device tree is listed first
IMAGE_BOOT_FILES =+ "devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"

# Enable FIT image generation
KERNEL_CLASSES += "kernel-fitimage"
KERNEL_IMAGETYPES += "fitImage"
FIT_IMAGE = "fitImage"

# Ensure the DTB is included inside the FIT image
EXTERNAL_KERNEL_DEVICETREE = "${DEPLOY_DIR_IMAGE}/devicetree"
FIT_CONF_FDT = "cortexa72-linux.dtb"
# This is the name of the DTB image section inside the fitImage file. This variable is used by
# u-boot-xlnx-scr.bbappend to generate the u-boot boot.scr boot script.
FIT_DTB_IMAGE_NAME = "fdt-${FIT_CONF_FDT}"

# Use a non-default disk partition layout.
WKS_FILES = "iba.wks"

# Generate WIC images for both QEMU and real hardware
IMAGE_FSTYPES += "wic"

# Even though we are using a wks file, tell wic not to update the fstab file but leave it
# alone. This way we get the same fstab file in our .wic[.qemu-sd] images that we get in
# our RAUC update bundles.
WIC_CREATE_EXTRA_ARGS += "--no-fstab-update"

# Since we are using a non-default disk partition layout, we must override variables that
# indicate the A/B partitions containing the fitImage and rootfs. These partition numbers
# must be consistent with the contents of the .wks file. These variables are used by
# u-boot-xlnx-scr.bb and .bbappend to generate the u-boot boot.scr boot script.
FIT_IMAGE_PARTITION_A = "2"
FIT_IMAGE_PARTITION_B = "3"
ROOTFS_PARTITION_A = "5"
ROOTFS_PARTITION_B = "6"
RAUC_SLOT_A = "rootfs.0"
RAUC_SLOT_B = "rootfs.1"
KERNEL_ROOT_SD = "root=/dev/${bootdev}${rootfs_partition} ro rootwait rauc.slot=${rauc_slot}"

# These sizes must match the kernel and rootfs partition sizes defined in the .wks file.
# Units are kbytes.
KERNEL_PARTITION_SIZE = "204800"
ROOTFS_PARTITION_SIZE = "614400"

### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' vrk160']['vrk160' != '${MACHINE}']}"
