#@TYPE: Machine
#@NAME: vrk160
#@DESCRIPTION: Machine configuration for the VRK160 RF evaluation board.

MACHINEOVERRIDES =. "${@['', 'vrk160:']['vrk160' !='${MACHINE}']}"

BBMULTICONFIG += "versal-fw"

# Use the generated system-top.dts from the local board handoff as the Linux DT.
CONFIG_DTFILE_DIR := "${@bb.utils.which(d.getVar('BBPATH'), 'conf/dts/${MACHINE}')}"
CONFIG_DTFILE ?= "${CONFIG_DTFILE_DIR}/cortexa72-linux.dts"
CONFIG_DTFILE[vardepsexclude] += "CONFIG_DTFILE_DIR"
EXTRA_DT_INCLUDE_FILES += "${@'%s/system-user.dtsi' % d.getVar('CONFIG_DTFILE_DIR') if (d.getVar('CONFIG_DTFILE') or '').endswith('cortexa72-linux.dts') else ''}"

# Use the local generated SDT tarball from the copied Vivado handoff.
# The SDT recipe expects a tarball bundle of files, not a raw unpacked directory.
SDT_URI = "file:///media/data/asalman/repos/nile-versal-rf-sdr-nti/vrk160-artifacts/sdt_work.tar.gz"
SDT_URI[S] = "${WORKDIR}/sdt_work"
SYSTEM_DTFILE_DEPENDS = "sdt-artifacts"
SYSTEM_DTFILE_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
SYSTEM_DTFILE = "${SYSTEM_DTFILE_DIR}/system-top.dts"
DT_INCLUDE:append = " ${SYSTEM_DTFILE_DIR}"
PDI_PATH = "/media/data/asalman/repos/nile-versal-rf-sdr-nti/vrk160-artifacts/vivado_project.runs/impl_1/x5xx_top_pld.pdi"

# Versal bootstrap firmware generation for PLM/PSM
PLM_DEPENDS = ""
PLM_MCDEPENDS = "mc::versal-fw:plm-firmware:do_deploy"
PLM_DEPLOY_DIR = "${TMPDIR}-versal-fw/deploy/images/${MACHINE}"
PSM_DEPENDS = ""
PSM_MCDEPENDS = "mc::versal-fw:psm-firmware:do_deploy"
PSM_FIRMWARE_DEPLOY_DIR = "${TMPDIR}-versal-fw/deploy/images/${MACHINE}"

# Yocto arm-trusted-firmware(TF-A) variables
TFA_CONSOLE ?= "pl011"
TFA_BL33_LOAD ?= "0x8000000"

# Set DDR Base address for u-boot-xlnx-scr variables
DDR_BASEADDR ?= "0x0"
SKIP_APPEND_BASEADDR ?= "0"

# Yocto KERNEL Variables
UBOOT_ENTRYPOINT  ?= "0x200000"
UBOOT_LOADADDRESS ?= "0x200000"

# Yocto MACHINE_FEATURES Variable
MACHINE_FEATURES += "vdu"

# Required generic machine inclusion
require conf/machine/versal-generic.conf

# Load the dynamic Versal firmware features
include conf/machine/include/vrk160/${BB_CURRENT_MC}-features.conf
LIBXIL_CONFIG = "conf/machine/include/vrk160/${BB_CURRENT_MC}-libxil.conf"

# This is an 'SDT' based BSP
XILINX_WITH_ESW = "sdt"

# Update bootbin to use the generated device tree.
BIF_PARTITION_IMAGE[device-tree] = "${RECIPE_SYSROOT}/boot/devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"

# Enable FIT image generation.
KERNEL_CLASSES += "kernel-fitimage"
KERNEL_IMAGETYPES += "fitImage"
FIT_IMAGE = "fitImage"

# Ensure the DTB is included inside the FIT image.
EXTERNAL_KERNEL_DEVICETREE = "${DEPLOY_DIR_IMAGE}/devicetree"
FIT_CONF_FDT = "cortexa72-linux.dtb"
FIT_DTB_IMAGE_NAME = "fdt-${FIT_CONF_FDT}"

# Use a non-default disk partition layout.
WKS_FILES = "iba.wks"

# Generate WIC images for both QEMU and real hardware.
IMAGE_FSTYPES += "wic"
WIC_CREATE_EXTRA_ARGS += "--no-fstab-update"

# Use the canonical KULA partition layout as the starting point for the board bring-up.
FIT_IMAGE_PARTITION_A = "2"
FIT_IMAGE_PARTITION_B = "3"
ROOTFS_PARTITION_A = "5"
ROOTFS_PARTITION_B = "6"
RAUC_SLOT_A = "rootfs.0"
RAUC_SLOT_B = "rootfs.1"
KERNEL_ROOT_SD = "root=/dev/${bootdev}${rootfs_partition} ro rootwait rauc.slot=${rauc_slot}"

KERNEL_PARTITION_SIZE = "204800"
ROOTFS_PARTITION_SIZE = "614400"

PACKAGE_EXTRA_ARCHS:append = "${@['', ' vrk160']['vrk160' != '${MACHINE}']}"
